[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maav-px4-test"
version = "0.1.0"
description = "Read-only MAVLink acceptance checks for MAAV PX4 vehicles"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.41",
    "pyserial>=3.5",
]

[project.scripts]
maav-test = "maav_test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
